<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>وين ألقى؟</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;margin:0;background:#f5f6f8;color:#111827}header{background:#101827;color:white;padding:24px 18px}h1{margin:0 0 8px;font-size:30px}.wrap{max-width:850px;margin:auto;padding:18px}.search{display:flex;gap:8px;margin-top:18px}.search input{flex:1;padding:15px;border:0;border-radius:14px;font-size:17px}.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:700;cursor:pointer;background:#111827;color:#fff}.card{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 14px #0000000d}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:#6b7280;font-size:13px}.price{font-size:22px;font-weight:800}.pill{display:inline-block;background:#e9f8ef;color:#147a3c;padding:5px 9px;border-radius:999px;font-size:12px}.warn{background:#fff4d6;color:#946200}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.nav a{color:white;text-decoration:none;background:#263246;padding:9px 12px;border-radius:10px}.empty{text-align:center;padding:45px 15px;color:#6b7280}</style></head><body><header><div class="wrap"><h1>🔎 وين ألقى؟</h1><div>دَوّر على المنتج واعرف وين موجود قبل ما تروح.</div><div class="search"><input id="q" placeholder="مثلاً: ماكينة إسبريسو، آيفون 16..."><button class="btn" onclick="searchProducts()">بحث</button></div><div class="nav"><a href="merchant.html">لوحة التاجر</a><a href="admin.html">الإدارة</a></div></div></header><main class="wrap"><div id="status" class="muted">جاهز للبحث</div><div id="results"></div></main><script>const SUPABASE_URL='YOUR_SUPABASE_URL';const SUPABASE_KEY='YOUR_SUPABASE_PUBLISHABLE_KEY';const online=SUPABASE_URL.startsWith('http')&&!SUPABASE_KEY.startsWith('YOUR_');const sb=online?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;const demo=[{name:'iPhone 16 256GB',brand:'Apple',category:'إلكترونيات',price:700,currency:'USD',qty:3,status:'available',updated_at:new Date().toISOString(),shop:'متجر دمشق للإلكترونيات',area:'المزة',phone:'0930000000',whatsapp:'963930000000'},{name:'ماكينة Nuova Simonelli Appia II',brand:'Nuova Simonelli',category:'معدات مطاعم',price:1250,currency:'USD',qty:1,status:'available',updated_at:new Date().toISOString(),shop:'بيت القهوة',area:'الشعلان',phone:'0940000000',whatsapp:'963940000000'}];function card(p){const old=(Date.now()-new Date(p.updated_at).getTime())/86400000;const fresh=old<=7;return `<section class="card"><div class="row"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.brand||'')} · ${esc(p.shop||'')}</div></div><div class="price">${esc(String(p.price))} ${esc(p.currency||'')}</div></div><p><span class="pill ${fresh?'':'warn'}">${fresh?'متوفر / تحديث حديث':'آخر تحديث قديم'}</span> · ${esc(p.area||'')}</p><div class="muted">آخر تحديث: ${new Date(p.updated_at).toLocaleString('ar-SY')}</div><div class="nav"><a class="btn" href="tel:${esc(p.phone||'')}">اتصال</a><a class="btn" href="https://wa.me/${esc(p.whatsapp||'')}">واتساب</a></div></section>`}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function searchProducts(){const q=document.getElementById('q').value.trim();const r=document.getElementById('results');document.getElementById('status').textContent=q?'جارِ البحث...':'اكتب اسم المنتج أولاً';if(!q){r.innerHTML='<div class="empty">مثلاً اكتب: آيفون 16</div>';return}let data=[];if(sb){const x=await sb.from('listings').select('price,currency,qty,status,updated_at,products(name,brand,category),shops(name,area,phone,whatsapp)').ilike('products.name',`%${q}%`).eq('status','available').order('price');if(!x.error&&x.data)data=x.data.map(v=>({name:v.products?.name,brand:v.products?.brand,price:v.price,currency:v.currency,qty:v.qty,status:v.status,updated_at:v.updated_at,shop:v.shops?.name,area:v.shops?.area,phone:v.shops?.phone,whatsapp:v.shops?.whatsapp}));}else data=demo.filter(p=>(p.name+' '+p.brand).toLowerCase().includes(q.toLowerCase()));document.getElementById('status').textContent=`وجدنا ${data.length} نتيجة`;r.innerHTML=data.length?data.map(card).join(''):'<div class="empty">ما لقينا المنتج حالياً. جرّب اسم أو ماركة مختلفة.</div>'}</script></body></html>
