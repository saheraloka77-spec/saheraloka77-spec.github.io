<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التاجر - وين ألقى؟</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;background:#f5f6f8;margin:0}.wrap{max-width:900px;margin:auto;padding:18px}header{background:#101827;color:#fff;padding:20px}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0}input,select{width:100%;box-sizing:border-box;padding:13px;margin:6px 0 12px;border:1px solid #ddd;border-radius:10px}.btn{background:#111827;color:#fff;border:0;padding:12px 16px;border-radius:10px;font-weight:700}.muted{color:#6b7280;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="wrap"><h2>🏪 لوحة التاجر</h2><div>إضافة وتعديل المنتجات والأسعار والمخزون.</div></div></header><main class="wrap"><div class="card"><h3>تسجيل الدخول</h3><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><button class="btn" onclick="login()">دخول</button><div id="msg" class="muted"></div></div><div class="card"><h3>إضافة منتج</h3><div class="grid"><input id="name" placeholder="اسم المنتج"><input id="brand" placeholder="الماركة"><input id="price" type="number" placeholder="السعر"><select id="currency"><option>USD</option><option>SYP</option></select><input id="qty" type="number" placeholder="الكمية"><select id="status"><option value="available">متوفر</option><option value="unknown">غير مؤكد</option><option value="sold_out">نفد</option></select></div><button class="btn" onclick="addProduct()">إضافة</button><div id="addmsg" class="muted"></div></div></main><script>const URL='YOUR_SUPABASE_URL',KEY='YOUR_SUPABASE_PUBLISHABLE_KEY';const sb=URL.startsWith('http')&&!KEY.startsWith('YOUR_')?supabase.createClient(URL,KEY):null;async function login(){if(!sb)return msg.textContent='اربط المشروع بـ Supabase أولاً.';const x=await sb.auth.signInWithPassword({email:email.value,password:password.value});msg.textContent=x.error?x.error.message:'تم الدخول.'}async function addProduct(){if(!sb)return addmsg.textContent='هذه النسخة جاهزة للربط، لكن لم نضع مفاتيح قاعدة البيانات بعد.';const u=await sb.auth.getUser();if(!u.data.user)return addmsg.textContent='سجّل الدخول أولاً.';addmsg.textContent='الخطوة التالية: ربط الحساب بمتجره ثم إضافة المنتج.'}</script></body></html>
